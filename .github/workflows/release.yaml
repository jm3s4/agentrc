name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to JSR and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Verify tag matches manifest versions
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
            const jsr = JSON.parse(readFileSync("jsr.json", "utf8")).version;
            if (pkg !== tag || jsr !== tag) {
              console.error(`Version mismatch: tag=${tag}, package.json=${pkg}, jsr.json=${jsr}`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Publish to JSR
        run: pnpm dlx jsr publish --allow-slow-types

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FLAGS=(--generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}"
